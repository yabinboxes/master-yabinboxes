name: Automation test snow modules

on:
  workflow_dispatch:

env:
  FEATURE_FLAG_TEST_ALL_MODULES: false
  FEATURE_FLAG_TEST_SNOW_MONKEY: false
  FEATURE_FLAG_TEST_DOCKER: false
  FEATURE_FLAG_TEST_HETZNER: true
  FEATURE_FLAG_TEST_CLOUDFLARE: false
  FEATURE_FLAG_TEST_AWS: false
  FEATURE_FLAG_TEST_AZURE: false
  FEATURE_FLAG_TEST_GCP: false
  FEATURE_FLAG_TEST_DIGITALOCEAN: false
  



jobs:

  # Snow Monkeys
  test-snow-monkeys-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Snow Monkeys Modules if FEATURE_FLAG_TEST_SNOW_MONKEY is enabled
        if: env.FEATURE_FLAG_TEST_SNOW_MONKEY == 'true' || env.FEATURE_FLAG_TEST_ALL_MODULES == 'true'
        run: |
          echo "------ test snow monkey modules ------"
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.SNOW_GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/test-snow-monkeys/examples-automation-test/dispatches \
          -d '{"event_type":"automation-snow-monkey-test-event","client_payload":{"unit":false,"integration":true, "feature_flag_test_snow_monkey": true}}'

  # Docker
  test-docker-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Docker Modules if FEATURE_FLAG_TEST_DOCKER is enabled
        if: env.FEATURE_FLAG_TEST_DOCKER == 'true' || env.FEATURE_FLAG_TEST_ALL_MODULES == 'true'
        run: |
          echo "------ test docker modules ------"
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.SNOW_GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/test-snow-monkeys/examples-automation-test/dispatches \
          -d '{"event_type":"automation-docker-test-event","client_payload":{"unit":false,"integration":true, "feature_flag_test_docker": true}}'

  # Hetzner
  test-hetzner-modules:
    needs:
      - test-snow-monkeys-modules
      - test-docker-modules
    runs-on: ubuntu-latest
    if: (!cancelled() && (needs.test-snow-monkeys-modules.result == 'success' || needs.test-snow-monkeys-modules.result == 'skipped') && (needs.test-docker-modules.result == 'success' || needs.test-docker-modules.result == 'skipped'))
    steps:
      - uses: actions/checkout@v4

      - name: Test Hetzner Modules if FEATURE_FLAG_TEST_HETZNER is enabled
        if: env.FEATURE_FLAG_TEST_HETZNER == 'true' || env.FEATURE_FLAG_TEST_ALL_MODULES == 'true'
        run: |
          echo "------ test hetzner modules ------"
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.SNOW_GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/test-snow-monkeys/examples-automation-test/dispatches \
          -d '{"event_type":"automation-hetzner-test-event","client_payload":{"unit":false,"integration":true, "feature_flag_test_hetzner": true}}'

  # Cloudflare
  test-cloudflare-modules:
    needs:
      - test-snow-monkeys-modules
      - test-docker-modules
    runs-on: ubuntu-latest
    if: (!cancelled() && (needs.test-snow-monkeys-modules.result == 'success' || needs.test-snow-monkeys-modules.result == 'skipped') && (needs.test-docker-modules.result == 'success' || needs.test-docker-modules.result == 'skipped'))
    steps:
      - uses: actions/checkout@v4

      - name: Test Hetzner Modules if FEATURE_FLAG_TEST_CLOUDFLARE is enabled
        if: env.FEATURE_FLAG_TEST_CLOUDFLARE == 'true' || env.FEATURE_FLAG_TEST_ALL_MODULES == 'true'
        run: |
          echo "------ test cloudflare modules ------"
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.SNOW_GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/test-snow-monkeys/examples-automation-test/dispatches \
          -d '{"event_type":"automation-cloudflare-test-event","client_payload":{"unit":false,"integration":true, "feature_flag_test_cloudflare": true}}'

  # AWS
  test-aws-modules:
    needs:
      - test-snow-monkeys-modules
      - test-docker-modules
    runs-on: ubuntu-latest
    if: (!cancelled() && (needs.test-snow-monkeys-modules.result == 'success' || needs.test-snow-monkeys-modules.result == 'skipped') && (needs.test-docker-modules.result == 'success' || needs.test-docker-modules.result == 'skipped'))
    steps:
      - uses: actions/checkout@v4

      - name: Test AWS Modules if FEATURE_FLAG_TEST_AWS is enabled
        if: env.FEATURE_FLAG_TEST_AWS == 'true' || env.FEATURE_FLAG_TEST_ALL_MODULES == 'true'
        run: |
          echo "------ test aws modules ------"
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.SNOW_GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/test-snow-monkeys/examples-automation-test/dispatches \
          -d '{"event_type":"automation-aws-test-event","client_payload":{"unit":false,"integration":true, "feature_flag_test_aws": true}}'

  # Azure
  test-azure-modules:
    needs:
      - test-snow-monkeys-modules
      - test-docker-modules
    runs-on: ubuntu-latest
    if: (!cancelled() && (needs.test-snow-monkeys-modules.result == 'success' || needs.test-snow-monkeys-modules.result == 'skipped') && (needs.test-docker-modules.result == 'success' || needs.test-docker-modules.result == 'skipped'))
    steps:
      - uses: actions/checkout@v4

      - name: Test Azure Modules if FEATURE_FLAG_TEST_AZURE is enabled
        if: env.FEATURE_FLAG_TEST_AZURE == 'true' || env.FEATURE_FLAG_TEST_ALL_MODULES == 'true'
        run: |
          echo "------ test azure modules ------"
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.SNOW_GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/test-snow-monkeys/examples-automation-test/dispatches \
          -d '{"event_type":"automation-azure-test-event","client_payload":{"unit":false,"integration":true, "feature_flag_test_azure": true}}'

  # GCP
  test-gcp-modules:
    needs:
      - test-snow-monkeys-modules
      - test-docker-modules
    runs-on: ubuntu-latest
    if: (!cancelled() && (needs.test-snow-monkeys-modules.result == 'success' || needs.test-snow-monkeys-modules.result == 'skipped') && (needs.test-docker-modules.result == 'success' || needs.test-docker-modules.result == 'skipped'))
    steps:
      - uses: actions/checkout@v4

      - name: Test GCP Modules if FEATURE_FLAG_TEST_GCP is enabled
        if: env.FEATURE_FLAG_TEST_GCP == 'true' || env.FEATURE_FLAG_TEST_ALL_MODULES == 'true'
        run: |
          echo "------ test gcp modules ------"
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.SNOW_GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/test-snow-monkeys/examples-automation-test/dispatches \
          -d '{"event_type":"automation-gcp-test-event","client_payload":{"unit":false,"integration":true, "feature_flag_test_gcp": true}}'

  # DigitalOcean
  test-digitalocean-modules:
    needs:
      - test-snow-monkeys-modules
      - test-docker-modules
    runs-on: ubuntu-latest
    if: (!cancelled() && (needs.test-snow-monkeys-modules.result == 'success' || needs.test-snow-monkeys-modules.result == 'skipped') && (needs.test-docker-modules.result == 'success' || needs.test-docker-modules.result == 'skipped'))
    steps:
      - uses: actions/checkout@v4

      - name: Test DigitalOcean Modules if FEATURE_FLAG_TEST_DIGITALOCEAN is enabled
        if: env.FEATURE_FLAG_TEST_DIGITALOCEAN == 'true' || env.FEATURE_FLAG_TEST_ALL_MODULES == 'true'
        run: |
          echo "------ test digitalocean modules ------"
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.SNOW_GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/test-snow-monkeys/examples-automation-test/dispatches \
          -d '{"event_type":"automation-digitalocean-test-event","client_payload":{"unit":false,"integration":true, "feature_flag_test_digitalocean": true}}'
    