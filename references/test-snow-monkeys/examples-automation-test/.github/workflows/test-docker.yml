name: Automation test Docker modules
run-name: Automation test Docker modules

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ automation-docker-test-event ]


jobs:

  checkout:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

  # build docker image and push to registry
  build_and_push_image:
    uses: snow-monkeys-modules/docker-iac/.github/workflows/main.yml@main
    with:
      type: build_and_push_image
      name: yabinm/growing-gravity
      tag: latest
      infra: test-docker/growing-gravity
      test_flag: true
    secrets:
      registry_user: ${{ secrets.GLOBAL_DOCKERHUB_USERNAME }}
      registry_token: ${{ secrets.GLOBAL_DOCKERHUB_TOKEN }}
      snow_token: ${{ secrets.SNOW_TOKEN }}
 