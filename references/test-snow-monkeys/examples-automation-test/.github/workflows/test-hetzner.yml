name: Automation test Hetzner modules
run-name: Automation test Hetzner modules

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ automation-hetzner-test-event ]


jobs:

  checkout:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

  # create aws s3 to store terraform state for hetzner
  # only resource that has to be removed manually is this s3 bucket state storage
  create_s3_bucket:
    needs: checkout
    uses: snow-monkeys-modules/aws-iac/.github/workflows/main.yml@main
    with:
      type: aws_s3_bucket
      type_values: |
        bucket_name=s3-test-snow-monkeys-20261
        region=us-east-2
        versioning=true
        encrypt=false
      name: s3-test-snow-monkeys-20261
    secrets:
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      snow_github_token: ${{ secrets.SNOW_GITHUB_TOKEN }}
      snow_token_pipeline: ${{ secrets.SNOW_TOKEN_PIPELINE }}


  # create and destroy firewall (resource) on hetzner
  create_firewall_on_hetzner:
    needs: create_s3_bucket
    uses: snow-monkeys-modules/hetzner-iac/.github/workflows/main.yml@main
    with:
      type: hcloud_firewall
      name: firewall-hetzner-test
      s3_bucket_state: s3-test-snow-monkeys-20261
      state_values: |
        bucket_name=s3-test-snow-monkeys-20261
        region=us-east-2
        encrypt=false
      test_flag: true    # test_flag is used to test the firewall resource, create and destroy in the same workflow
    secrets:
      hcloud_token: ${{ secrets.HETZNER_CLOUD_TOKEN }}
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY_TEST }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY_TEST }}
      snow_github_token: ${{ secrets.SNOW_GITHUB_TOKEN }}
      snow_token_pipeline: ${{ secrets.SNOW_TOKEN_PIPELINE }}

  use-output-firewall:
    needs: create_firewall_on_hetzner
    runs-on: ubuntu-22.04
    steps:
      - name: Use output
        run: echo "Url is ${{ needs.create_firewall_on_hetzner.outputs.server_ip }}"
      
      - run: sleep 5


  # create server (server) on hetzner
  create_server_on_hetzner:
    needs: create_firewall_on_hetzner
    uses: snow-monkeys-modules/hetzner-iac/.github/workflows/main.yml@main
    with:
      type: hcloud_server
      name: server-hetzner-test
      type_values: |
        server_type=cpx12
        image=ubuntu-26.04
        location=hel1
      infra: test-hetzner/server/infra
      s3_bucket_state: s3-test-snow-monkeys-20261
      state_values: |
        bucket_name=s3-test-snow-monkeys-20261
        region=us-east-2
        encrypt=false
    secrets:
      hcloud_token: ${{ secrets.HETZNER_CLOUD_TOKEN }}
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY_TEST }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY_TEST }}
      snow_github_token: ${{ secrets.SNOW_GITHUB_TOKEN }}
      snow_token_pipeline: ${{ secrets.SNOW_TOKEN_PIPELINE }}
  
  use-output-server:
    needs: create_server_on_hetzner
    runs-on: ubuntu-22.04
    steps:
      - name: Use output
        run: echo "Url is ${{ needs.create_server_on_hetzner.outputs.server_ip }}"
      
      - run: sleep 5

  # create docker compose (service) on hetzner
  # Downstream always() conditions keep app deploy and server cleanup running after failure.
  deploy-service-nginx:
    needs: use-output-server
    uses: snow-monkeys-modules/hetzner-iac/.github/workflows/main.yml@main
    with:
      type: docker_compose
      name: server-hetzner-test     # same name because is same repository
      host: server-hetzner-test
      infra: test-hetzner/service/infra
      expected_url: server-hetzner-test
    secrets:
      ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY_TEST }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY_TEST }}
      snow_github_token: ${{ secrets.SNOW_GITHUB_TOKEN }}
      snow_token_pipeline: ${{ secrets.SNOW_TOKEN_PIPELINE }}

  use-output-deploy-service-nginx:
    needs: deploy-service-nginx
    if: always() && needs.deploy-service-nginx.result != 'skipped'
    continue-on-error: true
    runs-on: ubuntu-22.04
    steps:
      - name: Use output
        run: echo "Url is ${{ needs.deploy-service-nginx.outputs.address }}"
      
      - run: sleep 5


  # create docker compose app (resource) on hetzner
  # Downstream always() conditions keep server cleanup running after failure.
  deploy-application-astro:
    needs:
      - create_server_on_hetzner
      - use-output-deploy-service-nginx
    if: always() && needs.create_server_on_hetzner.result == 'success'
    uses: snow-monkeys-modules/hetzner-iac/.github/workflows/main.yml@main
    with:
      type: docker_compose_app
      name: server-hetzner-test     # same name because is same repository
      host: server-hetzner-test
      expected_url: server-hetzner-test:4321
      infra: test-hetzner/application/infra
    secrets:
      ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY_TEST }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY_TEST }}
      snow_github_token: ${{ secrets.SNOW_GITHUB_TOKEN }}
      snow_token_pipeline: ${{ secrets.SNOW_TOKEN_PIPELINE }}

  use-output-deploy-app:
    needs: deploy-application-astro
    if: always() && needs.deploy-application-astro.result != 'skipped'
    continue-on-error: true
    runs-on: ubuntu-22.04
    steps:
      - name: Use output
        run: echo "Astro app connection address is ${{ needs.deploy-application-astro.outputs.address }}"
    
      - run: sleep 5

  # destroy server (server) on hetzner
  # runs whenever the server was created, including after a failed service or app deploy
  # no continue-on-error: a failed destroy must fail the workflow
  destroy_server_on_hetzner:
    needs:
      - create_server_on_hetzner
      - deploy-service-nginx
      - deploy-application-astro
    if: always() && needs.create_server_on_hetzner.result == 'success'
    uses: snow-monkeys-modules/hetzner-iac/.github/workflows/main.yml@main
    with:
      type: hcloud_server
      name: server-hetzner-test
      type_values: |
        server_type=cpx12
        image=ubuntu-26.04
        location=hel1
      infra: test-hetzner/server/infra
      s3_bucket_state: s3-test-snow-monkeys-20261
      state_values: |
        bucket_name=s3-test-snow-monkeys-20261
        region=us-east-2
        encrypt=false
      destroy: true   # destroy is used to destroy the server in a separate workflow
    secrets:
      hcloud_token: ${{ secrets.HETZNER_CLOUD_TOKEN }}
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY_TEST }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY_TEST }}
      snow_github_token: ${{ secrets.SNOW_GITHUB_TOKEN }}
      snow_token_pipeline: ${{ secrets.SNOW_TOKEN_PIPELINE }}
