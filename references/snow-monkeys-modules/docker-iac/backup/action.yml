    # build dev image to ensure that the container is working properly
      # in all platforms. condition: if the name input flag is empty string
      # and if default name is the same as the repository name
    - name: Build and push, if the name input flag is empty string
      id: build
      shell: bash
      env:
        INFRA: ${{ inputs.infra }}
        DOCKER_FILE: ${{ inputs.docker_file }}
        IMAGE_NAME: ${{ inputs.name }}
      run: |
        CONTEXT="${INFRA:-.}"
        docker buildx build \
          --platform linux/amd64,linux/arm64,linux/arm64/v8 \
          -f $CONTEXT/$DOCKER_FILE \
          -t $IMAGE_NAME:latest --push $CONTEXT 

          
