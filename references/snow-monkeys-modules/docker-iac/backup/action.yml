name: Build and push container image
description: Build and push a container image to the specified registry
author: Yabin Monroy

inputs:
    
  registry:
    required: false
    description: 'The registry to push the image to'
    default: 'docker.io'
  name:
    required: false
    description: 'The name of the image to build'
    default: ''
  tag:
    required: false
    description: 'The tag for the image'
    default: latest
  platforms:
    required: false
    description: 'The platforms to build for'
    default: linux/amd64,linux/arm64,linux/arm64/v8
  test_container:
    required: false
    description: 'Whether to build a test container'
    default: ''
  enable_cloud_builder:
    required: false
    description: 'Whether to enable the cloud builder'
    default: ''
  endpoint:
    required: false
    description: 'The endpoint for the cloud builder'
    default: ''
  docker_file:
    required: false
    description: 'defaulth dockerfile'
    default: 'Dockerfile'
  infra:
    required: false
    description: 'Caller repo directory copied to the remote host'
    default: ''
  test_flag:
    required: false
    description: 'Test flag'
    default: 'false'
  registry_user:
    required: false
    description: 'The username for the registry'
  registry_token:
    required: false
    description: 'The token for the registry'
  snow_token:
    required: false
    description: 'The token for the Snow API'
outputs:
  container_name:
    description: 'The name of the container image built and pushed'
    value: ${{ steps.set_container_name.outputs.container_name }}

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

    # pending... loging to different registries: 
    # - GitHub (ghcr.io)
    # - GitLab (registry.gitlab.com)
    # - Azure (<registry-name>.azurecr.io)
    # - AWS Public Elastic Container Registry (public.ecr.aws)
    # - AWS Elastic Container Registry (<aws-account-number>.dkr.ecr.<region>.amazonaws.com)
    # - Google Container Registry (gcr.io)  - need extra authentication
    # - Google Artifact Registry (<location>-docker.pkg.dev)  - need extra authentication
    # https://github.com/docker/login-action


    # login to registry
    - name: 1. Login to Docker Hub
      shell: bash
      run: |
        echo "${{ inputs.registry_token }}" | docker login \
          --username "${{ inputs.registry_user }}" \
          --password-stdin

    # setup Buildx
    - name: setup BuildX
      shell: bash
      run: |
        docker buildx create --name multi-builder --use --bootstrap
        docker buildx ls

    # setup QEMU
#    - name: 5. Set up QEMU
#      uses: docker/setup-qemu-action@v3

    # setup Buildx
