name: civo-k8s-tf
description: Civo Kubernetes Cluster with Terraform
author: Yabin Monroy

inputs:
  name:
    required: true
    description: "Name of application"
  url:
    required: false
    description: "URL of application"
    default: "localhost"
  url-path:
    required: false
    description: "URL path of application"
    default: "/"
  port:
    required: false
    description: "Port of application"
    default: '80'
  image:
    required: false
    description: "Image name"
    default: ""
  image-tag:
    required: false
    description: "Image tag"
    default: "latest"
  replicas:
    required: false
    description: "Number of replicas"
    default: "1"
  min-replicas:
    required: false
    description: "Minimum number of replicas"
    default: "1"
  max-replicas:
    required: false
    description: "Maximum number of replicas"
    default: "1"
  civo-token:
    required: true
    description: "Civo token"
  snow-github-token:
    required: true
    description: "Snow monkeys github token"
          
  

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

  
    - name: 1. clone and exec helm repo for the working project
      shell: bash
      id: validate-repo
      env:
        GH_TOKEN: ${{ inputs.snow-github-token}}
      run: |
        echo "---------- clone mirror project -----------"
        echo "EXIST_REPO=$(gh repo view snow-monkeys-mirror-repos/mirror-civo-${{ github.event.repository.name }} | tr '\n' ' ')" >> $GITHUB_OUTPUT
        ls
        echo "---------------------"
 
    - name: 2. connect to civo kubernetes
      shell: bash
      if: ${{ ! steps.validate-repo.outputs.EXIST_REPO }}
      run: |
        curl -sL https://civo.com/get | sh
        civo apikey add my-cluster ${{ inputs.civo-token }}
        civo kubernetes config k8s_demo_1 --save
        kubectl cluster-info

    #     condition if repository doesnt exist
    - name: 3. with public image - repo doesnt exist for working project - clone and exec helm repo for the working project
      shell: bash
      if: ${{ ! steps.validate-repo.outputs.EXIST_REPO }}
      env:
        GH_TOKEN: ${{ inputs.snow-github-token }}
      run: |
        echo "doesnt exist snow-monkeys-org/mirror-civo-${{ github.event.repository.name }}"
        git config --global user.email yabin.monroy.1@gmail.com && git config --global user.name yabinboxes
        echo "cloning config repo helm-template-public-img-traefik"
        git clone https://oath2:${{ inputs.snow-github-token }}@github.com/snow-monkeys-org/helm-template-public-img-traefik.git
        echo "creating mirror-civo-${{ github.event.repository.name }}"
        gh repo create snow-monkeys-org/mirror-civo-${{ github.event.repository.name }} --private
        mkdir mirror-civo-${{ github.event.repository.name }}
        echo "---------------------"
        ls
        echo "---------------------"
        cd helm-template-public-img-traefik
        cp -R application.yaml repo-creds.yaml ../mirror-civo-${{ github.event.repository.name }}/
        cp -R myapp-helm ../mirror-civo-${{ github.event.repository.name }}/myapp-helm/
        cd ..
        cd mirror-civo-${{ github.event.repository.name }}
        echo "---------------------"
        ls
        echo "---------------------"
        echo "---------insert into values.yaml------------"
        sed -i "s,name:.*,name:\ mirror-civo-${{ github.event.repository.name }}," myapp-helm/values.yaml
        sed -i "s,repository:.*,repository:\ ${{ inputs.image }}," myapp-helm/values.yaml
        sed -i "/^service:/,/port:/{/^\([[:space:]]*port: \).*/s//\1${{ inputs.port }}/}" myapp-helm/values.yaml
        sed -i "s,tag:.*,tag:\ ${{ inputs.image-tag }}," myapp-helm/values.yaml
        sed -i "s,host:.*,host:\ ${{ inputs.url }}," myapp-helm/values.yaml
        sed -i "s,path:.*,path:\ ${{ inputs.url-path }}," myapp-helm/values.yaml
        cat myapp-helm/values.yaml
        echo "---------------------"
        echo "---------insert into application.yaml------------"
        sed -i "s,name:.*,name:\ mirror-civo-${{ github.event.repository.name }}," application.yaml
        sed -i "/^httpGet:/,/path:/{/^\([[:space:]]*path: \).*/s//\1health/}" application.yaml
        sed -i "/^ingress:/,/enabled:/{/^\([[:space:]]*enabled: \).*/s//\1true/}" application.yaml
        sed -i "s,monkeyrepourl,https://github.com/snow-monkeys-org/mirror-civo-${{ github.event.repository.name }}.git," application.yaml
        cat application.yaml
        echo "---------------------"
        echo "--------insert into creds-------------"
        sed -i "s,name:.*,name:\ mirror-civo-${{ github.event.repository.name }}," repo-creds.yaml
        sed -i "s,username:.*,username:\ yabinboxes," repo-creds.yaml
        sed -i "s,monkeyrepourl,https://github.com/snow-monkeys-org/mirror-civo-${{ github.event.repository.name }}.git," repo-creds.yaml
        sed -i "s,monkeypassword,${{ inputs.snow-github-token }}," repo-creds.yaml
        cat repo-creds.yaml
        echo "---------------------"
        git config --global user.email yabin.monroy.1@gmail.com && git config --global user.name yabinboxes
        git config --global init.defaultBranch main
        git init
        git add .
        git commit -m "init new helm repo"
        git branch -M main
        git remote add origin https://yabinboxes:${{ inputs.snow-github-token }}@github.com/snow-monkeys-org/mirror-civo-${{ github.event.repository.name }}.git
        git push -u origin main
        echo "---------------------"
        ls
        echo "---------------------"

    - name: 4. with public image - update repo
      shell: bash
      if: ${{ steps.validate-repo.outputs.EXIST_REPO }}
      run: |
        echo "----------------- prepare update cloning -----------------"
        mkdir cloning${{ github.sha }}
        cd cloning${{ github.sha }}
        echo "promoting into dev environment"
        git config --global user.email yabin.monroy.1@gmail.com && git config --global user.name yabinboxes
        git clone https://oath2:${{ inputs.snow-github-token }}@github.com/snow-monkeys-org/mirror-civo-${{ github.event.repository.name }}.git
        cd mirror-civo-${{ github.event.repository.name }}
        echo "---------------------"
        ls
        echo "---------------------"
        echo "---------insert into values.yaml------------"
        sed -i "s,repository:.*,repository:\ ${{ inputs.image }}," myapp-helm/values.yaml
        sed -i "/^service:/,/port:/{/^\([[:space:]]*port: \).*/s//\1${{ inputs.port }}/}" myapp-helm/values.yaml
        sed -i "s,tag:.*,tag:\ ${{ inputs.image-tag }}," myapp-helm/values.yaml
        sed -i "s,host:.*,host:\ ${{ inputs.url }}," myapp-helm/values.yaml
        sed -i "s,path:.*,path:\ ${{ inputs.url-path }}," myapp-helm/values.yaml
        cat myapp-helm/values.yaml
        echo "---------------------"
        echo "checkout main branch"
        git checkout main
        echo "updating image tag in values file"
        git add . && git commit -m "update image tag"
        git push

    - name: 5. apply to civo kubernetes
      shell: bash
      if: ${{ ! steps.validate-repo.outputs.EXIST_REPO }}
      run: |
        cd mirror-civo-${{ github.event.repository.name }}
        kubectl apply -f repo-creds.yaml
        kubectl apply -f application.yaml
    