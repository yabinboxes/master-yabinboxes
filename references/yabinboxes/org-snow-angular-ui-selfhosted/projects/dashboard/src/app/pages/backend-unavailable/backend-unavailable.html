<div class="min-h-screen flex items-center justify-center bg-base-200">
  <div class="text-center">
    <h1 class="mb-8 font-display text-[clamp(1.8rem,4vw,2.5rem)] font-normal leading-[1.12] tracking-tight">Unable to reach backend service</h1>

    <button class="btn btn-primary" type="button" (click)="tryAgain()" [disabled]="isRetrying()">
      @if (isRetrying()) {
        <span class="loading loading-spinner loading-xs"></span>
        Trying again...
      } @else {
        Try again
      }
    </button>

    @if (retryFailed()) {
      <div class="alert alert-error mt-6 max-w-md mx-auto">
        <span>Still unable to reach backend service.</span>
      </div>
    }
  </div>
</div>
