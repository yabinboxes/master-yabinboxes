<h1 class="my-4 mt-5 font-display text-[1.8rem] font-normal leading-[1.12] tracking-tight">Easy Deployment</h1>

<div class="flex items-center justify-center w-full mb-4">
  <label
    for="dropzone-file"
    class="flex flex-col items-center justify-center w-full h-64 border-2 border-base-300 border-dashed rounded-lg cursor-pointer bg-base-100 hover:bg-base-300"
  >
    <div class="flex flex-col items-center justify-center pt-6 pb-6">
      <svg
        class="w-8 h-8 mb-4 text-base-content opacity-70"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 20 16"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"
        />
      </svg>
      <p class="mb-2 text-sm text-base-content opacity-70">
        <span class="font-semibold">Click to upload</span> or drag and drop
      </p>
      <p class="text-xs text-base-content opacity-70">SVG, PNG, JPG or GIF (MAX. 800x400px)</p>
    </div>
    <input id="dropzone-file" type="file" class="hidden" />
  </label>
</div>

<label class="input my-2 min-w-[600px]">
  <input type="text" class="grow" placeholder="url" />
</label>

  <input type="text" class="grow" placeholder="image" />
</label>

  <input type="text" class="grow" placeholder="port" />

</label>
