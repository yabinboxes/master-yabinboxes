<div class="login-page min-h-screen flex items-center justify-center px-6 py-10 bg-base-200">
  <div class="card w-full max-w-md rounded-xl border border-base-300/60 bg-base-100 shadow-xl">
    <div class="card-body gap-6 p-8">
      <div class="flex flex-col items-center gap-4 text-center">
        <img
          src="images/cluster.png"
          alt="SnowMonkeys"
          class="h-20 w-auto [image-rendering:pixelated] drop-shadow-lg"
        />
        <div>
          <p class="font-mono text-[11px] font-medium uppercase tracking-[0.08em] text-primary">SnowMonkeys</p>
          <h1 class="mt-1 font-display text-[1.8rem] font-normal leading-[1.12] tracking-tight text-base-content">IaC Dashboard</h1>
        </div>
      </div>


      @if (errorMessage) {
        <div class="alert alert-error text-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-5 w-5" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span>{{ errorMessage }}</span>
        </div>
      }

      @if (usesGitlab()) {
        <button
          type="button"
          class="btn btn-neutral w-full gap-3 h-12 text-base font-medium"
          (click)="signInWithGitlab()"
          [disabled]="isLoading"
        >
          @if (isLoading) {
            <span class="loading loading-spinner loading-sm"></span>
            <span>Signing in…</span>
          } @else {
            <svg class="h-5 w-5 shrink-0" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M23.955 13.587l-1.342-4.135-2.664-8.189a.455.455 0 0 0-.867 0L16.418 9.45H7.582L4.919 1.263a.455.455 0 0 0-.867 0L1.386 9.449.044 13.587a.924.924 0 0 0 .331 1.023L12 23.054l11.625-8.443a.92.92 0 0 0 .33-1.024"/>
            </svg>
            <span>Continue with GitLab</span>
          }
        </button>
        <p class="text-xs text-center text-base-content/50 leading-relaxed">
          Use your GitLab account to access the dashboard.
        </p>
      } @else {
        <button
          type="button"
          class="btn btn-neutral w-full gap-3 h-12 text-base font-medium"
          (click)="signInWithGitHub()"
          [disabled]="isLoading"
        >
          @if (isLoading) {
            <span class="loading loading-spinner loading-sm"></span>
            <span>Signing in…</span>
          } @else {
            <svg class="h-5 w-5 shrink-0" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.167 22 16.418 22 12c0-5.523-4.477-10-10-10z" clip-rule="evenodd"/>
            </svg>
            <span>Continue with GitHub</span>
          }
        </button>
        <p class="text-xs text-center text-base-content/50 leading-relaxed">
          Use your GitHub account to access the dashboard.
        </p>
      }

      <div class="divider my-0 text-xs text-base-content/40">or</div>

      <a href="https://docs.snow-monkeys.com/docs/home" target="_blank" rel="noopener noreferrer" class="btn btn-ghost btn-sm w-full text-base-content/70">
        Browse documentation
      </a>
    </div>
  </div>
</div>
