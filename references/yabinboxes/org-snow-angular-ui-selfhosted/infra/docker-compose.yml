services:

  snow-dashboard-ui:
    image: yabinm/snow-ui-dashboard-selfhosted:latest
    pull_policy: always
    container_name: snow-ui-dashboard-selfhosted
    environment:
      baseUrl: http://localhost:8080
    ports:
      - "4200:4000"
    networks:
      - snow-network

networks:
  snow-network:
    driver: bridge


