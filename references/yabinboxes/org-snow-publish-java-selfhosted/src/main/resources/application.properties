spring.application.name=snow-publish-java-selfhosted

# Virtual threads for REST API request handling
spring.threads.virtual.enabled=true

# Server
server.address=0.0.0.0
server.port=8080

# Logging — errors only (postgres-connection logs connection diagnostics at INFO)
logging.level.root=ERROR
logging.level.postgres-connection=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.com.zaxxer.hikari.pool.HikariPool=INFO
logging.level.org.postgresql=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.orm.jdbc.bind=ERROR
spring.jpa.show-sql=false

# PostgreSQL
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:admin}
spring.datasource.url=${POSTGRES_DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.hikari.maximum-pool-size=20

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Scheduling
spring.task.scheduling.pool.size=4

# Jackson — API JSON uses camelCase (Java bean names)
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE

# OpenAPI / Swagger
springdoc.api-docs.path=/openapi
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Authorization — Bearer validation on /connectors/** (Firebase ID token + snowTokenPipeline).
# Default true. Set false (or SNOW_AUTH_TOKEN_VALIDATION_ENABLED=false) to skip checks.
snow.auth.token-validation-enabled=${SNOW_AUTH_TOKEN_VALIDATION_ENABLED:true}
