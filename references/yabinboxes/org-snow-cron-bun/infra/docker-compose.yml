services:


  snow-cron-bun:
    image: yabinm/health-cron-bun:latest
    pull_policy: always
    container_name: snow-cron-bun
    ports:
      - "4202:3000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_SCHEMA: connectors
    networks:
      - snow-network

networks:
  snow-network:
    driver: bridge
