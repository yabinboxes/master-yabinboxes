<section id="docs-shell" class="relative flex h-screen min-h-0 w-full">
  <!-- Mobile top bar -->
  <header
    class="fixed inset-x-0 top-0 z-40 flex h-14 items-center gap-3 border-b border-base-300/60 bg-base-100/90 px-3 backdrop-blur-md lg:hidden"
  >
    <button
      type="button"
      class="flex size-9 items-center justify-center rounded-lg border border-base-300 bg-base-100"
      [attr.aria-expanded]="navOpen()"
      aria-controls="docs-sidebar"
      (click)="toggleNav()"
    >
      <span class="sr-only">{{ navOpen() ? 'Close menu' : 'Open menu' }}</span>
      @if (navOpen()) {
        <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      }
    </button>
    <a routerLink="/docs/home" class="font-display text-base font-normal tracking-tight" (click)="closeNav()">
      SnowMonkeys
    </a>
  </header>

  <!-- Backdrop (mobile) -->
  @if (navOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-40 bg-base-content/40 lg:hidden"
      aria-label="Close menu"
      (click)="closeNav()"
    ></button>
  }

  <!-- Sidebar -->
  <aside
    id="docs-sidebar"
    class="fixed inset-y-0 left-0 z-50 flex h-full w-72 max-w-[85vw] shrink-0 flex-col border-r border-base-300/60 bg-base-200 transition-transform duration-200 ease-out max-lg:shadow-xl lg:static lg:z-auto lg:max-w-none lg:translate-x-0 lg:shadow-none"
    [class.max-lg:-translate-x-full]="!navOpen()"
    [class.max-lg:translate-x-0]="navOpen()"
  >
    <docs-left-menu (navigated)="closeNav()" />
  </aside>

  <!-- Content -->
  <div id="docs-scroll" class="min-h-0 min-w-0 flex-1 overflow-y-auto pt-14 lg:pt-0">
    <router-outlet />
  </div>
</section>
