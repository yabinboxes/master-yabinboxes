@if (markdownPath()) {
  <docs-page-header
    [eyebrow]="pageMeta().eyebrow"
    [title]="pageMeta().title"
    [lead]="pageMeta().lead"
  />
  <docs-markdown [src]="markdownPath()" [skipFirstH1]="true" />
} @else {
  <div class="mx-auto max-w-3xl px-6 py-10">
    <div class="alert alert-warning">
      <span>Markdown file not found.</span>
    </div>
  </div>
}
