<section id="module-list" class="px-6 pb-14 pt-10 md:pt-14">
  <p class="font-mono text-[11px] font-medium uppercase tracking-[0.08em] text-primary">
    Guide
  </p>
  <h1 class="mt-2 font-display text-[clamp(1.8rem,4vw,2.25rem)] font-normal leading-[1.12] tracking-tight">
    Modules
  </h1>
  <p class="mt-2 max-w-[30rem] text-base leading-[1.65] text-base-content/70">
    Browse reusable modules by provider and type.
  </p>

  <div class="mt-8 grid max-w-3xl auto-rows-fr grid-cols-1 gap-3">
    @for (card of modules(); track card) {
      <docs-module-card [itemCard]="card" />
    } @empty {
      <div class="rounded-2xl border border-base-300 bg-base-100 p-[18px]">
        <p class="text-sm font-medium">No modules match these filters</p>
        <p class="mt-2 text-sm text-base-content/70">
          Re-enable a provider or type to see modules again.
        </p>
      </div>
    }
  </div>
</section>
