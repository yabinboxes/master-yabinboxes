<a
  class="group block h-full w-full rounded-2xl border border-base-300 bg-base-100 p-[18px] no-underline transition-colors hover:border-base-content/20 hover:bg-base-200/40"
  [routerLink]="pageRoute(itemCard().page)"
>
  <div class="flex items-start justify-between gap-4">
    <div class="flex min-w-0 items-start gap-3">
      <div
        class="flex size-10 shrink-0 items-center justify-center rounded-xl bg-primary/10 ring-1 ring-inset ring-primary/30"
      >
        <img
          [src]="providerIcon(itemCard().provider)"
          [alt]="itemCard().provider"
          class="h-5 w-5"
        />
      </div>
      <div class="min-w-0">
        <h2 class="truncate font-sans text-base font-semibold leading-tight tracking-tight text-base-content">
          {{ itemCard().name }}
        </h2>
        <p
          class="mt-1 inline-flex rounded-full border border-base-300 bg-base-100 px-2 py-0.5 font-mono text-[11px] text-base-content/70"
        >
          {{ itemCard().provider }}
        </p>
        <p class="mt-2 line-clamp-2 text-sm leading-relaxed text-base-content/70">
          {{ itemCard().description }}
        </p>
      </div>
    </div>
    <lucide-angular
      [img]="container"
      class="my-icon mt-1 shrink-0 text-base-content/40 transition-opacity group-hover:opacity-80"
    ></lucide-angular>
  </div>
</a>
