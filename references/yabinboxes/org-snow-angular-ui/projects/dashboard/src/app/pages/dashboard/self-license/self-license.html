<div class="container mx-auto p-6 max-w-4xl">
  <div class="card rounded-xl border border-base-300/60 bg-base-100">
    <div class="card-body">
      <!-- Markdown Content -->
      <div class="prose prose-lg max-w-none prose-headings:text-base-content prose-p:text-base-content/80 prose-strong:text-base-content prose-li:text-base-content/80">
        <markdown [data]="markdownContent"></markdown>
      </div>

      <!-- Acceptance Section -->
      <div class="divider my-8"></div>

      <!-- Footer -->
      <div class="mt-8 pt-6 border-t border-base-300">
        <p class="text-xs text-base-content/50 text-center">
          Last updated: {{ currentDate | date:'longDate' }}
        </p>
      </div>
    </div>
  </div>
</div>
