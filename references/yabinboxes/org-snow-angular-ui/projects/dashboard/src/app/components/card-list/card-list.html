<div class="grid grid-cols-1 gap-3">
  @for (card of filteredDeployments(); track card.sourceId; let idx = $index) {
  <snow-card
    [itemCard]="card"
    [modalId]="idx"
    (titleClick)="onCardTitleClick($event)"
    (removed)="onCardRemoved($event)"
  />
  }
</div>
