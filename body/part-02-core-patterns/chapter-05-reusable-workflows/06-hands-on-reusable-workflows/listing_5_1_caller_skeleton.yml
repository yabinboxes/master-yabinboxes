# listing_5_1_caller_skeleton.yml
# Minimal caller for any snow-monkeys-modules reusable workflow.
# Copy this file to .github/workflows/ in a caller repository, then fill
# type, type_values, name, and the provider secrets.

name: Caller skeleton

on:
  workflow_dispatch:

jobs:
  provision:
    uses: snow-monkeys-modules/hetzner-iac/.github/workflows/main.yml@main
    with:
      type: hcloud_server
      name: example-cluster
      type_values: |
        server_type=cpx11
        image=ubuntu-24.04
        location=hel1
    secrets:
      hcloud_token: ${{ secrets.HETZNER_CLOUD_TOKEN }}
      ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
      snow_token: ${{ secrets.SNOW_TOKEN }}
      snow_token_pipeline: ${{ secrets.SNOW_TOKEN_PIPELINE }}
