# listing_8_1_pages_stateless.yml
# RESOURCE. Cloudflare has no VM CLUSTER type.
# Pattern from
# yabinboxes/main-examples/cloudflare/cloudflare stateless/resources/.github/workflows/pages-stateless.yml

name: Cloudflare pages stateless

on:
  workflow_dispatch:

jobs:
  create_pages_project:
    uses: snow-monkeys-modules/cloudflare-iac/.github/workflows/main.yml@main
    with:
      type: cloudflare_pages_project
      name: pages-cloudflare
      type_values: |
        production_branch=main
    secrets:
      cloudflare_token: ${{ secrets.CLOUDFLARE_TOKEN }}
      cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      snow_token: ${{ secrets.SNOW_TOKEN }}
      snow_token_pipeline: ${{ secrets.SNOW_TOKEN_PIPELINE }}

  print_output:
    needs: create_pages_project
    runs-on: ubuntu-22.04
    steps:
      - name: Pages project
        run: echo "${{ needs.create_pages_project.outputs.server_ip }}"
