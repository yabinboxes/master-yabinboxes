# listing_6_24_aws_s3_bucket.yml
# RESOURCE. Pattern from
# yabinboxes/main-examples/aws/aws stateless/resources/.github/workflows/s3-bucket.yml

name: AWS S3 bucket

on:
  workflow_dispatch:

jobs:
  create_s3_bucket:
    uses: snow-monkeys-modules/aws-iac/.github/workflows/main.yml@main
    with:
      type: aws_s3_bucket
      name: s3-snow-monkeys-state
      type_values: |
        bucket_name=s3-snow-monkeys-state
        region=us-east-2
        versioning=true
        encrypt=true
    secrets:
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      snow_token: ${{ secrets.SNOW_TOKEN }}
      snow_token_pipeline: ${{ secrets.SNOW_TOKEN_PIPELINE }}

  print_bucket:
    needs: create_s3_bucket
    runs-on: ubuntu-22.04
    steps:
      - name: Terraform output JSON
        run: echo "${{ needs.create_s3_bucket.outputs.terraform_output }}"
