# listing_6_25_aws_instance.yml
# CLUSTER. Same job shape as Listing 6.2, different module and type.

name: AWS instance cluster

on:
  workflow_dispatch:

jobs:
  create_instance:
    uses: snow-monkeys-modules/aws-iac/.github/workflows/main.yml@main
    with:
      type: aws_instance
      name: server-aws-stateless
      type_values: |
        instance_type=t3.micro
        region=us-east-2
    secrets:
      aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
      snow_token: ${{ secrets.SNOW_TOKEN }}
      snow_token_pipeline: ${{ secrets.SNOW_TOKEN_PIPELINE }}

  print_server_ip:
    needs: create_instance
    runs-on: ubuntu-22.04
    steps:
      - name: Server IP
        run: echo "${{ needs.create_instance.outputs.server_ip }}"
