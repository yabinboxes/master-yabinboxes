# listing_6_9_cluster_then_app.yml
# Integrated example: CLUSTER then APPLICATION on the same Snow name.
# Pattern from yabinboxes/main-examples/hetzner/hetznez stateless/combined.

name: Cluster then application

on:
  workflow_dispatch:

jobs:
  create_server:
    uses: snow-monkeys-modules/hetzner-iac/.github/workflows/main.yml@main
    with:
      type: hcloud_server
      name: server-example-1-stateless
      type_values: |
        server_type=cpx11
        image=ubuntu-24.04
        location=hel1
    secrets:
      hcloud_token: ${{ secrets.HETZNER_CLOUD_TOKEN }}
      ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
      snow_token: ${{ secrets.SNOW_TOKEN }}
      snow_token_pipeline: ${{ secrets.SNOW_TOKEN_PIPELINE }}

  print_server_ip:
    needs: create_server
    runs-on: ubuntu-22.04
    steps:
      - name: Server IP
        run: echo "${{ needs.create_server.outputs.server_ip }}"

  deploy_application:
    needs:
      - create_server
      - print_server_ip
    uses: snow-monkeys-modules/hetzner-iac/.github/workflows/main.yml@main
    with:
      type: docker_compose_app
      name: growing-gravity
      host: server-example-1-stateless
      expected_url: server-example-1-stateless:8080
      infra: infra
    secrets:
      snow_token: ${{ secrets.SNOW_TOKEN }}
      snow_token_pipeline: ${{ secrets.SNOW_TOKEN_PIPELINE }}

  print_app_address:
    needs: deploy_application
    runs-on: ubuntu-22.04
    steps:
      - name: Application address
        run: echo "${{ needs.deploy_application.outputs.address }}"
