# listing_10_20_application_stateless.yml
# APPLICATION on the CLUSTER from Listing 10.17. Pattern from
# yabinboxes/main-examples/hetzner/hetznez stateless/application/.github/workflows/application-stateless.yml

name: Hetzner application stateless

on:
  workflow_dispatch:

jobs:
  deploy_application:
    uses: snow-monkeys-modules/hetzner-iac/.github/workflows/main.yml@main
    with:
      type: docker_compose_app
      name: application-hetzner-stateless
      host: server-hetzner-stateless
      expected_url: server-hetzner-stateless:8080
      infra: infra
    secrets:
      snow_token: ${{ secrets.SNOW_TOKEN }}
      snow_token_pipeline: ${{ secrets.SNOW_TOKEN_PIPELINE }}

  print_address:
    needs: deploy_application
    runs-on: ubuntu-22.04
    steps:
      - name: Application address
        run: echo "${{ needs.deploy_application.outputs.address }}"
