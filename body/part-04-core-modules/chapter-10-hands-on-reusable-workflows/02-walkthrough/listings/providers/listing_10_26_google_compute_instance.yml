# listing_10_26_google_compute_instance.yml
# CLUSTER. Swap the module; keep the Listing 10.1 job shape.

name: GCP compute instance cluster

on:
  workflow_dispatch:

jobs:
  create_instance:
    uses: snow-monkeys-modules/gcp-iac/.github/workflows/main.yml@main
    with:
      type: google_compute_instance
      name: server-gcp-stateless
      type_values: |
        machine_type=e2-micro
        zone=us-central1-a
        project=my-gcp-project
    secrets:
      gcp_credentials: ${{ secrets.GCP_CREDENTIALS }}
      ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
      snow_token: ${{ secrets.SNOW_TOKEN }}
      snow_token_pipeline: ${{ secrets.SNOW_TOKEN_PIPELINE }}

  print_server_ip:
    needs: create_instance
    runs-on: ubuntu-22.04
    steps:
      - name: Server IP
        run: echo "${{ needs.create_instance.outputs.server_ip }}"
